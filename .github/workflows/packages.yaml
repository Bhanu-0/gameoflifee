
name: Maven Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven Project
        run: mvn clean package -DskipTests

      - name: list
        run: ls

      - name: target
        run: ls -l gameoflife-web


      - name: Upload JAR to JFrog
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        run: |
          curl --fail --show-error --silent \
            --user "$JFROG_USERID:$JFROG_PASSWORD" \
            --upload-file "gameoflife-web/target/gameoflife.war" \
            "https://trialm094fy.jfrog.io/artifactory/nov23/gameoflife.war"

        


      